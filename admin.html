<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>CleanMax Admin</title>
<style>
:root{--bg:#f4f7fa;--card:#fff;--text:#14202b;--muted:#5b6b7a;--brand:#1565c0;--line:#e2e8ee;--red:#e30613;--green:#0a7a45}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:5;background:#000;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;color:#fff}
header img{height:34px;display:block}header .r{display:flex;gap:8px;align-items:center;font-size:.85rem}
button{font:inherit;cursor:pointer}.btn{border:0;border-radius:8px;padding:9px 12px;font-weight:700;background:var(--brand);color:#fff}
.btn.sec{background:#fff;color:var(--brand);border:1px solid var(--brand)}.btn.red{background:var(--red)}.btn.green{background:#25d366}.btn.sm{padding:6px 10px;font-size:.82rem}
.btn:disabled{opacity:.6}
input,select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
main{max-width:900px;margin:0 auto;padding:14px 12px 60px}
#login{max-width:340px;margin:80px auto;padding:20px;background:#fff;border-radius:14px;border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;text-align:center}
.err{color:#b00020;font-size:.88rem;min-height:1.1em}
.tabs{display:flex;gap:8px;margin-bottom:10px}.tabs .btn{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 11px;font-size:.82rem;font-weight:600}.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.bar{display:flex;gap:8px;margin-bottom:10px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
summary{list-style:none;padding:11px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px}summary::-webkit-details-marker{display:none}
.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.oid{font-weight:800}.sub{color:var(--muted);font-size:.85rem}
.badge{font-size:.72rem;font-weight:800;padding:3px 8px;border-radius:10px;background:#e8eef5;color:#33475b;white-space:nowrap}
.s-NEW,.s-PAID{background:#e3f1ff;color:#0d47a1}.s-PACKED,.s-SHIPPED{background:#fff1d6;color:#8a5200}.s-DELIVERED{background:#dff5e8;color:var(--green)}.s-CANCELLED{background:#fde2e4;color:#b00020}.s-PAYMENT{background:#eee;color:#555}
.body{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}
.kv{font-size:.9rem;margin-top:8px}.kv b{display:inline-block;min-width:70px;color:var(--muted);font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lab{font-size:.78rem;color:var(--muted);font-weight:600;margin-bottom:3px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.prod{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}.prod h3{margin:0 0 8px;font-size:1rem}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:20px;font-size:.9rem;display:none;z-index:20}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:1.25rem}.stat span{font-size:.75rem;color:var(--muted)}
</style></head><body>

<script>
const API="https://script.google.com/macros/s/AKfycbwqwqmqqDXrytp5Yg9VFGCJ8d0SatHWFKKC1uqDAHKDrcl8vMbcnjioxc-cOwWtlsdrbA/exec";   // same URL as in shop.html
const SHOP="https://wa.me/";
const STAT=["NEW","PAYMENT PENDING","PAID","PACKED","SHIPPED","DELIVERED","CANCELLED"];
const $=id=>document.getElementById(id);
const esc=t=>String(t==null?"":t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let token=sessionStorage.getItem("cmadm")||"",ORD=[],FIL="ALL";
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",2200)}
async function call(body){
  if(API.startsWith("PASTE"))throw new Error("Set the API URL at the top of admin.html");
  const r=await(await fetch(API,{method:"POST",body:JSON.stringify(Object.assign({token},body))})).json();
  if(r.auth===false){logout(true)}
  return r;
}
async function login(){
  $("lerr").textContent="";$("lbtn").disabled=true;
  try{const r=await call({action:"adminLogin",password:$("pw").value});
    if(!r.ok)throw new Error(r.error);token=r.token;sessionStorage.setItem("cmadm",token);$("pw").value="";start()}
  catch(e){$("lerr").textContent=e.message||"Login failed"}
  $("lbtn").disabled=false;
}
function logout(expired){token="";sessionStorage.removeItem("cmadm");$("app").style.display="none";$("loginWrap").style.display="block";if(expired)$("lerr").textContent="Session expired. Please log in again."}
function start(){$("loginWrap").style.display="none";$("app").style.display="block";loadOrders();loadProducts()}
$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
function tab(n){$("p1").style.display=n===1?"block":"none";$("p2").style.display=n===2?"block":"none";$("t1").className="btn"+(n===1?"":" sec");$("t2").className="btn"+(n===2?"":" sec")}

/* ---- orders ---- */
async function loadOrders(){
  try{const r=await call({action:"adminOrders"});if(!r.ok)throw new Error(r.error);ORD=r.orders;renderChips();renderOrders()}
  catch(e){toast(e.message)}
}
function renderChips(){
  const cnt={ALL:ORD.length};ORD.forEach(o=>cnt[o.status]=(cnt[o.status]||0)+1);
  $("chips").innerHTML=["ALL"].concat(STAT).map(s=>`<button class="chip ${FIL===s?"on":""}" onclick="FIL='${s}';renderChips();renderOrders()">${s==="ALL"?"All":s} (${cnt[s]||0})</button>`).join("");
  $("sAll").textContent=ORD.length;
  $("sShip").textContent=ORD.filter(o=>["NEW","PAID","PACKED"].includes(o.status)).length;
  const n=new Date(),today=String(n.getDate()).padStart(2,"0")+" "+["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][n.getMonth()]+" "+n.getFullYear();
  $("sNew").textContent=ORD.filter(o=>o.time.startsWith(today)).length;
}
function renderOrders(){
  const q=$("q").value.trim().toLowerCase();
  const list=ORD.filter(o=>(FIL==="ALL"||o.status===FIL)&&(!q||(o.orderId+o.name+o.phone).toLowerCase().includes(q)));
  $("list").innerHTML=list.length?list.map(card).join(""):'<p class="sub" style="text-align:center">No orders found.</p>';
}
function card(o){
  const sc="s-"+o.status.split(" ")[0];
  return `<details id="d-${o.orderId}"><summary><div class="top"><span class="oid">${esc(o.orderId)}</span><span class="badge ${sc}">${esc(o.status)}</span></div>
  <div class="sub">${esc(o.name)} · ₹${esc(o.total)} · ${esc(o.payment)}</div><div class="sub">${esc(o.time)}</div></summary>
  <div class="body">
   <div class="kv"><b>Phone</b><a href="tel:${o.phone}">${o.phone}</a></div>
   <div class="kv"><b>Address</b>${esc(o.address)}, ${esc(o.pincode)}</div>
   <div class="kv"><b>Items</b>${esc(o.items)}</div>
   ${o.email?`<div class="kv"><b>Email</b>${esc(o.email)}</div>`:""}
   ${o.paymentId?`<div class="kv"><b>Pay ID</b>${esc(o.paymentId)}</div>`:""}
   <div><div class="lab">Status</div><select id="st-${o.orderId}">${STAT.map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}</select></div>
   <div class="row2"><div><div class="lab">Courier</div><input id="co-${o.orderId}" list="couriers" value="${esc(o.courier)}" placeholder="e.g. Delhivery"></div>
   <div><div class="lab">Tracking ID / link</div><input id="tr-${o.orderId}" value="${esc(o.tracking)}" placeholder="Tracking number"></div></div>
   <div class="acts">
    <button class="btn sm" onclick="gen('${o.orderId}')">Generate tracking ID</button>
    <button class="btn sm" onclick="save('${o.orderId}')">Save</button>
    <button class="btn sm green" onclick="wa('${o.orderId}')">WhatsApp customer</button>
    <button class="btn sm sec" onclick="label('${o.orderId}')">Print label</button>
    <button class="btn sm sec" onclick="copyAddr('${o.orderId}')">Copy address</button>
   </div>
   ${o.updated?`<div class="sub">Last updated: ${esc(o.updated)}</div>`:""}
  </div></details>`;
}
const find=id=>ORD.find(o=>o.orderId===id);
function gen(id){const t="CMT"+new Date().toISOString().slice(2,10).replace(/-/g,"")+Math.floor(1000+Math.random()*9000);$("tr-"+id).value=t;if(!$("co-"+id).value)$("co-"+id).value="Self delivery"}
async function save(id,quiet){
  const o=find(id);
  try{const r=await call({action:"adminUpdate",orderId:id,status:$("st-"+id).value,courier:$("co-"+id).value,tracking:$("tr-"+id).value});
    if(!r.ok)throw new Error(r.error);if(!quiet)toast("Saved");
    const open=document.getElementById("d-"+id)?.open;await loadOrders();if(open){const d=document.getElementById("d-"+id);if(d)d.open=true}}
  catch(e){toast(e.message||"Could not save")}
}
function msgFor(o,st,co,tr){
  const site=new URL("shop.html",location.href).href;
  let m=`Hi ${o.name}, your CleanMax India order ${o.orderId} is ${st}.`;
  if(co||tr)m+=` Courier: ${co||"-"}. Tracking: ${tr||"-"}.`;
  return m+` Track anytime with your Order ID and mobile number: ${site}`;
}
function wa(id){const o=find(id);const m=msgFor(o,$("st-"+id).value,$("co-"+id).value,$("tr-"+id).value);window.open(SHOP+"91"+o.phone+"?text="+encodeURIComponent(m),"_blank")}
function copyAddr(id){const o=find(id);const t=`${o.name}\n${o.address}\n${o.pincode}\nPh: ${o.phone}`;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("Address copied"),()=>toast("Copy not allowed"))}
function label(id){
  const o=find(id),cod=o.payment==="COD";
  const w=window.open("","_blank");if(!w)return toast("Allow pop-ups to print");
  w.document.write(`<html><head><title>${esc(id)}</title><style>body{font-family:Arial;padding:16px}.b{border:2px solid #000;padding:14px;max-width:380px}h3{margin:0 0 6px}.cod{font-size:1.4rem;font-weight:bold;border:2px solid #000;padding:6px;margin-top:10px;text-align:center}</style></head><body><div class="b">
  <b>TO:</b><h3>${esc(o.name)}</h3><div>${esc(o.address)}<br><b>PIN ${esc(o.pincode)}</b><br>Ph: ${esc(o.phone)}</div><hr>
  <div><b>Order:</b> ${esc(o.orderId)}<br><b>Items:</b> ${esc(o.items)}</div>${cod?`<div class="cod">COD: Collect ₹${esc(o.total)}</div>`:`<div class="cod">PREPAID</div>`}<hr>
  <b>FROM:</b><br>CleanMax India<br>1-250 Murabail, Kalladka Post, Bantwal Taluk,<br>Dakshina Kannada, Karnataka 574222<br>Ph: +91 88844 69933</div><script>window.onload=()=>print()<\/script></body></html>`);w.document.close();
}

/* ---- stock & prices ---- */
async function loadProducts(){
  try{const r=await call({action:"adminCatalog"});if(!r.ok)throw new Error(r.error);
    $("prods").innerHTML=Object.keys(r.products).map(id=>{const p=r.products[id];return `<div class="prod"><h3>${esc(p.name)}</h3>
    <div class="row3"><div><div class="lab">Stock</div><input id="ps-${id}" type="number" min="0" value="${p.stock}"></div>
    <div><div class="lab">Offer price ₹</div><input id="pp-${id}" type="number" min="1" value="${p.price}"></div>
    <div><div class="lab">MRP ₹</div><input id="pm-${id}" type="number" min="1" value="${p.mrp}"></div></div>
    <button class="btn sm" onclick="saveProd(${id})">Save</button></div>`}).join("")}
  catch(e){toast(e.message)}
}
async function saveProd(id){
  try{const r=await call({action:"adminSaveProduct",id,stock:$("ps-"+id).value,price:$("pp-"+id).value,mrp:$("pm-"+id).value});
    if(!r.ok)throw new Error(r.error);toast("Saved – website updated")}catch(e){toast(e.message||"Could not save")}
}
if(token)start();
</script></body></html>
